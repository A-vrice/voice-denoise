name: quality-baseline

# Manual: regenerate tools/quality/baseline.json on the CI (Linux) environment,
# where PESQ is available, and upload it (plus the metric report) as artifacts.
on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: astral-sh/setup-uv@v5

      - run: bun install --frozen-lockfile

      - name: Run denoise chain on fixtures
        run: bun run tools/quality/run_chain.ts

      - name: Record baseline (STOI + PESQ)
        run: uv run tools/quality_gate.py --update-baseline --report tools/quality/out/report.json

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-baseline
          path: |
            tools/quality/baseline.json
            tools/quality/out/report.json
            tools/quality/out/timing.json
